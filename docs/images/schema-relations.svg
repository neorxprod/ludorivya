<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #f7f7fb; }
    .entity { fill: #ffffff; stroke: #3a3a4a; stroke-width: 2; }
    .assoc  { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
    .hub    { fill: #ffffff; stroke: #6d28d9; stroke-width: 3.5; }
    .tname  { font-size: 16px; font-weight: 800; fill: #1d1d28; text-anchor: middle; }
    .tsub   { font-size: 11px; fill: #7c3aed; text-anchor: middle; font-weight: 600; }
    .l1n { stroke: #16a34a; stroke-width: 2.6; fill: none; }
    .lnn { stroke: #7c3aed; stroke-width: 2.6; fill: none; }
    .lnnp{ stroke: #ea580c; stroke-width: 2.6; fill: none; }
    .l11 { stroke: #2563eb; stroke-width: 2.6; fill: none; }
    .lfk { stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
    .card { font-size: 13px; font-weight: 800; fill: #111; stroke: #ffffff; stroke-width: 3.5; paint-order: stroke; }
    .ltitle { font-size: 22px; font-weight: 800; fill: #1d1d28; }
    .lgd { font-size: 13px; fill: #1d1d28; }
  </style>

  <rect class="bg" width="1180" height="820"/>
  <text class="ltitle" x="40" y="46">Ludorivya — les relations de la base</text>
  <text class="lgd" x="40" y="70" fill="#6b7280">Les boîtes violettes sont des « tables de liaison » : elles relient deux tables entre elles.</text>

  <!-- ============ LIAISONS (dessinées sous les boîtes) ============ -->

  <!-- studios 1-N games -->
  <line class="l1n" x1="250" y1="360" x2="500" y2="360"/>
  <!-- platforms (1-N) game_platforms (N-1) games -->
  <line class="lnn" x1="250" y1="140" x2="300" y2="140"/>
  <line class="lnn" x1="470" y1="140" x2="540" y2="332"/>
  <!-- genres (1-N) game_genres (N-1) games -->
  <line class="lnn" x1="250" y1="600" x2="300" y2="600"/>
  <line class="lnn" x1="470" y1="600" x2="540" y2="392"/>
  <!-- games (1-N) duels (N-1) users -->
  <line class="lnnp" x1="600" y1="334" x2="600" y2="166"/>
  <line class="lnnp" x1="700" y1="140" x2="830" y2="180"/>
  <!-- games (1-N) reviews (N-1) users -->
  <line class="lnnp" x1="585" y1="394" x2="560" y2="500"/>
  <line class="lnnp" x1="660" y1="522" x2="845" y2="216"/>
  <!-- games (1-N) library_entries (N-1) users -->
  <line class="lnnp" x1="630" y1="394" x2="700" y2="500"/>
  <line class="lnnp" x1="800" y1="522" x2="880" y2="216"/>
  <!-- users 1-1 user_profiles -->
  <line class="l11" x1="915" y1="216" x2="915" y2="330"/>
  <!-- users (1-N) topics (1-N) topic_replies -->
  <line class="lfk" x1="965" y1="204" x2="965" y2="452"/>
  <line class="lfk" x1="965" y1="500" x2="965" y2="592"/>

  <!-- ============ CARDINALITES (1 / N) ============ -->
  <text class="card" x="262" y="352">1</text>
  <text class="card" x="486" y="352">N</text>
  <text class="card" x="262" y="132">1</text>
  <text class="card" x="486" y="132">N</text>
  <text class="card" x="520" y="318">1</text>
  <text class="card" x="262" y="592">1</text>
  <text class="card" x="486" y="592">N</text>
  <text class="card" x="520" y="408">1</text>
  <text class="card" x="610" y="326">1</text>
  <text class="card" x="610" y="172">N</text>
  <text class="card" x="715" y="135">N</text>
  <text class="card" x="820" y="180">1</text>
  <text class="card" x="568" y="420">1</text>
  <text class="card" x="548" y="500">N</text>
  <text class="card" x="855" y="214">1</text>
  <text class="card" x="640" y="420">1</text>
  <text class="card" x="700" y="512">N</text>
  <text class="card" x="895" y="214">1</text>
  <text class="card" x="900" y="212">1</text>
  <text class="card" x="900" y="326">1</text>

  <!-- ============ BOITES ============ -->
  <!-- platforms -->
  <rect class="entity" x="90" y="116" width="160" height="48" rx="10"/>
  <text class="tname" x="170" y="146">platforms</text>
  <!-- game_platforms -->
  <rect class="assoc" x="300" y="112" width="170" height="56" rx="10"/>
  <text class="tname" x="385" y="136">game_platforms</text>
  <text class="tsub" x="385" y="154">liaison N-N</text>
  <!-- duels -->
  <rect class="assoc" x="515" y="112" width="185" height="56" rx="10"/>
  <text class="tname" x="607" y="136">duels</text>
  <text class="tsub" x="607" y="154">liaison N-N (versus)</text>
  <!-- users -->
  <rect class="entity" x="830" y="156" width="170" height="48" rx="10"/>
  <text class="tname" x="915" y="186">users</text>
  <!-- studios -->
  <rect class="entity" x="90" y="336" width="160" height="48" rx="10"/>
  <text class="tname" x="170" y="366">studios</text>
  <!-- games (HUB) -->
  <rect class="hub" x="500" y="332" width="160" height="58" rx="12"/>
  <text class="tname" x="580" y="358" font-size="18">games</text>
  <text class="tsub" x="580" y="376" fill="#6d28d9">le catalogue</text>
  <!-- user_profiles -->
  <rect class="entity" x="830" y="330" width="170" height="48" rx="10"/>
  <text class="tname" x="915" y="360">user_profiles</text>
  <!-- reviews -->
  <rect class="assoc" x="475" y="500" width="170" height="56" rx="10"/>
  <text class="tname" x="560" y="524">reviews</text>
  <text class="tsub" x="560" y="542">liaison N-N (note)</text>
  <!-- library_entries -->
  <rect class="assoc" x="665" y="500" width="180" height="56" rx="10"/>
  <text class="tname" x="755" y="524">library_entries</text>
  <text class="tsub" x="755" y="542">liaison N-N (biblio)</text>
  <!-- game_genres -->
  <rect class="assoc" x="300" y="572" width="170" height="56" rx="10"/>
  <text class="tname" x="385" y="596">game_genres</text>
  <text class="tsub" x="385" y="614">liaison N-N</text>
  <!-- genres -->
  <rect class="entity" x="90" y="576" width="160" height="48" rx="10"/>
  <text class="tname" x="170" y="606">genres</text>
  <!-- topics -->
  <rect class="entity" x="880" y="452" width="170" height="48" rx="10"/>
  <text class="tname" x="965" y="482">topics</text>
  <!-- topic_replies -->
  <rect class="assoc" x="880" y="592" width="170" height="48" rx="10"/>
  <text class="tname" x="965" y="622">topic_replies</text>
  <text class="card" x="952" y="222">1</text>
  <text class="card" x="952" y="446">N</text>
  <text class="card" x="952" y="516">1</text>
  <text class="card" x="952" y="588">N</text>

  <!-- ============ LEGENDE ============ -->
  <rect x="90" y="700" width="1000" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text class="lgd" x="110" y="726" font-weight="800">Légende des relations</text>

  <line class="l1n" x1="115" y1="752" x2="155" y2="752"/>
  <text class="lgd" x="165" y="757">1-N — un studio a plusieurs jeux</text>

  <line class="l11" x1="115" y1="778" x2="155" y2="778"/>
  <text class="lgd" x="165" y="783">1-1 — un user a un seul profil</text>

  <line class="lnn" x1="545" y1="752" x2="585" y2="752"/>
  <text class="lgd" x="595" y="757">N-N — via une table de liaison</text>

  <line class="lnnp" x1="545" y1="778" x2="585" y2="778"/>
  <text class="lgd" x="595" y="783">N-N « porteuse » — la liaison a des attributs (note, heures, vainqueur…)</text>
</svg>
