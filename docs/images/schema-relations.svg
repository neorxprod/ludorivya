<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #c9c9d6; stroke-width: 1.5; }
    .assoc { fill: #eef0ff; stroke: #8a8ae0; stroke-width: 1.5; }
    .tname { font-size: 14px; font-weight: 700; fill: #1d1d1f; }
    .col { font-size: 11.5px; fill: #5b5b66; }
    .key { font-size: 11.5px; fill: #4f46e5; font-weight: 600; }
    .rel { font-size: 12px; font-weight: 700; fill: #4f46e5; stroke: #f8f8fb; stroke-width: 5; paint-order: stroke; }
    .line { stroke: #9a9ab0; stroke-width: 1.6; fill: none; }
    .dashed { stroke-dasharray: 5 4; }
  </style>

  <rect width="1140" height="600" fill="#f8f8fb"/>
  <text x="40" y="38" font-size="17" font-weight="700" fill="#1d1d1f">Ludorivya — schéma relationnel (11 tables)</text>

  <!-- Lignes (dessinées sous les boîtes) -->
  <line class="line" x1="135" y1="118" x2="580" y2="135"/>
  <line class="line" x1="135" y1="295" x2="360" y2="295"/>
  <line class="line" x1="360" y1="295" x2="580" y2="135"/>
  <line class="line" x1="135" y1="465" x2="360" y2="470"/>
  <line class="line" x1="360" y1="470" x2="580" y2="135"/>
  <line class="line" x1="980" y1="115" x2="980" y2="290"/>
  <line class="line" x1="980" y1="115" x2="965" y2="485"/>
  <line class="line" x1="580" y1="135" x2="965" y2="485"/>
  <line class="line" x1="980" y1="115" x2="705" y2="485"/>
  <line class="line" x1="580" y1="135" x2="705" y2="485"/>
  <line class="line dashed" x1="980" y1="115" x2="580" y2="135"/>
  <line class="line" x1="580" y1="210" x2="580" y2="320"/>
  <line class="line dashed" x1="980" y1="170" x2="690" y2="360"/>

  <!-- Étiquettes de relations -->
  <text class="rel" x="330" y="115">1-N</text>
  <text class="rel" x="240" y="288">N-N</text>
  <text class="rel" x="240" y="458">N-N</text>
  <text class="rel" x="990" y="210">1-1</text>
  <text class="rel" x="740" y="112">created_by (1-N)</text>
  <text class="rel" x="850" y="330">avis</text>
  <text class="rel" x="630" y="330">bibliothèque</text>

  <!-- studios -->
  <rect class="box" x="40" y="70" width="190" height="96" rx="10"/>
  <text class="tname" x="55" y="92">studios</text>
  <text class="key" x="55" y="112">id (PK)</text>
  <text class="col" x="55" y="128">name · country</text>
  <text class="col" x="55" y="144">founded_year · website</text>

  <!-- games -->
  <rect class="box" x="470" y="60" width="220" height="150" rx="10"/>
  <text class="tname" x="485" y="82">games</text>
  <text class="key" x="485" y="102">id (PK)</text>
  <text class="key" x="485" y="118">studio_id (FK, RESTRICT)</text>
  <text class="key" x="485" y="134">created_by (FK, SET NULL)</text>
  <text class="col" x="485" y="150">title · description</text>
  <text class="col" x="485" y="166">release_date · age_rating</text>
  <text class="col" x="485" y="182">cover_url</text>

  <!-- users -->
  <rect class="box" x="880" y="60" width="200" height="110" rx="10"/>
  <text class="tname" x="895" y="82">users</text>
  <text class="key" x="895" y="102">id (PK)</text>
  <text class="col" x="895" y="118">username (UNIQUE)</text>
  <text class="col" x="895" y="134">email (UNIQUE)</text>
  <text class="col" x="895" y="150">password_hash</text>

  <!-- user_profiles -->
  <rect class="box" x="880" y="240" width="200" height="100" rx="10"/>
  <text class="tname" x="895" y="262">user_profiles</text>
  <text class="key" x="895" y="282">user_id (PK = FK)</text>
  <text class="col" x="895" y="298">bio</text>
  <text class="key" x="895" y="314">favorite_platform_id (FK)</text>

  <!-- platforms -->
  <rect class="box" x="40" y="250" width="190" height="90" rx="10"/>
  <text class="tname" x="55" y="272">platforms</text>
  <text class="key" x="55" y="292">id (PK)</text>
  <text class="col" x="55" y="308">name (UNIQUE)</text>
  <text class="col" x="55" y="324">manufacturer · generation</text>

  <!-- game_platforms -->
  <rect class="box assoc" x="280" y="250" width="160" height="90" rx="10"/>
  <text class="tname" x="295" y="272">game_platforms</text>
  <text class="key" x="295" y="292">PK (game_id,</text>
  <text class="key" x="295" y="306">platform_id)</text>
  <text class="col" x="295" y="324">release_region</text>

  <!-- genres -->
  <rect class="box" x="40" y="430" width="190" height="70" rx="10"/>
  <text class="tname" x="55" y="452">genres</text>
  <text class="key" x="55" y="472">id (PK)</text>
  <text class="col" x="55" y="488">name (UNIQUE)</text>

  <!-- game_genres -->
  <rect class="box assoc" x="280" y="430" width="160" height="80" rx="10"/>
  <text class="tname" x="295" y="452">game_genres</text>
  <text class="key" x="295" y="472">PK (game_id,</text>
  <text class="key" x="295" y="486">genre_id)</text>

  <!-- library_entries -->
  <rect class="box assoc" x="600" y="430" width="210" height="110" rx="10"/>
  <text class="tname" x="615" y="452">library_entries</text>
  <text class="key" x="615" y="472">id (PK)</text>
  <text class="key" x="615" y="488">UNIQUE (user_id, game_id)</text>
  <text class="col" x="615" y="504">status · playtime_hours</text>
  <text class="col" x="615" y="520">added_at</text>

  <!-- reviews -->
  <rect class="box assoc" x="860" y="430" width="210" height="110" rx="10"/>
  <text class="tname" x="875" y="452">reviews</text>
  <text class="key" x="875" y="472">id (PK)</text>
  <text class="key" x="875" y="488">UNIQUE (game_id, user_id)</text>
  <text class="col" x="875" y="504">rating (0–20) · comment</text>
  <text class="col" x="875" y="520">created_at</text>

  <!-- duels -->
  <rect class="box assoc" x="470" y="320" width="220" height="92" rx="10"/>
  <text class="tname" x="485" y="342">duels (mode versus)</text>
  <text class="key" x="485" y="362">winner_game_id (FK)</text>
  <text class="key" x="485" y="378">loser_game_id (FK)</text>
  <text class="col" x="485" y="394">user_id (FK, SET NULL) · created_at</text>

  <!-- Légende -->
  <rect x="40" y="540" width="14" height="14" rx="4" class="box"/>
  <text class="col" x="62" y="551">table d'entités</text>
  <rect x="180" y="540" width="14" height="14" rx="4" class="box assoc"/>
  <text class="col" x="202" y="551">table d'association (N-N)</text>
  <line class="line dashed" x1="390" y1="547" x2="430" y2="547"/>
  <text class="col" x="440" y="551">relation facultative (NULL autorisé)</text>
</svg>
