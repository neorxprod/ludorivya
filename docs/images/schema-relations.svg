<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" font-family="Consolas, 'Segoe UI', Arial, sans-serif">
  <style>
    .bg { fill: #fbfbfd; }
    .bx { fill: #ffffff; stroke: #cbd0d8; stroke-width: 1.5; }
    .hd { fill: #2f3545; }
    .ha { fill: #6d28d9; }
    .tn { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .fld { fill: #2b2f38; font-size: 12.5px; }
    .pk { fill: #b45309; font-size: 12.5px; font-weight: 700; }
    .fk { fill: #2563eb; font-size: 12.5px; }
    .mut{ fill: #8a909c; font-size: 11.5px; }
    .ln { stroke: #9aa0ac; stroke-width: 1.6; fill: none; }
    .lnd{ stroke: #b7bcc6; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .card { font-size: 12px; font-weight: 800; fill: #2f3545; stroke: #fbfbfd; stroke-width: 3; paint-order: stroke; }
    .rel { font-size: 12px; font-weight: 700; fill: #6d28d9; stroke: #fbfbfd; stroke-width: 4; paint-order: stroke; }
    .title { font-size: 20px; font-weight: 800; fill: #1d1d28; }
  </style>

  <rect class="bg" width="1400" height="940"/>
  <text class="title" x="34" y="42">Schéma relationnel — Ludorivya (13 tables)</text>

  <!-- ============ RELATIONS (sous les boites) ============ -->
  <!-- studios 1-N games -->
  <path class="ln" d="M250 360 H470"/>
  <!-- games N-N platforms (via game_platforms) -->
  <path class="ln" d="M250 130 H320"/>
  <path class="ln" d="M530 130 H470 V330"/>
  <!-- games N-N genres (via game_genres) -->
  <path class="ln" d="M250 600 H320"/>
  <path class="ln" d="M530 600 H470 V400"/>
  <!-- games 1-N duels  &  users 1-N duels -->
  <path class="ln" d="M590 330 V150 H830"/>
  <path class="ln" d="M1040 120 H1180"/>
  <!-- games 1-N reviews  &  users 1-N reviews -->
  <path class="ln" d="M690 400 V470 H830"/>
  <path class="ln" d="M1040 360 H1110 V470 H1040"/>
  <!-- games 1-N library_entries  &  users 1-N library_entries -->
  <path class="ln" d="M640 400 V690 H830"/>
  <path class="ln" d="M1180 200 V690 H1040"/>
  <!-- users 1-1 user_profiles -->
  <path class="ln" d="M1255 200 V300"/>
  <!-- platforms 1-N user_profiles (favorite_platform_id) -->
  <path class="lnd" d="M140 175 V250 H1255 V300"/>
  <!-- users 1-N games (created_by) -->
  <path class="lnd" d="M690 335 H760 V215 H1285 V220"/>
  <!-- users 1-N topics  &  topics 1-N topic_replies -->
  <path class="lnd" d="M1330 220 V610 H1390"/>
  <path class="ln" d="M1180 800 H1100"/>

  <!-- cardinalites -->
  <text class="card" x="262" y="352">1</text><text class="card" x="452" y="352">N</text>
  <text class="card" x="262" y="122">1</text><text class="card" x="500" y="122">N</text><text class="card" x="452" y="320">1</text>
  <text class="card" x="262" y="592">1</text><text class="card" x="500" y="592">N</text><text class="card" x="452" y="410">1</text>
  <text class="card" x="600" y="168">1</text><text class="card" x="812" y="142">N</text>
  <text class="card" x="1050" y="112">1</text><text class="card" x="1165" y="112">N</text>
  <text class="card" x="700" y="420">1</text><text class="card" x="812" y="462">N</text>
  <text class="card" x="1050" y="352">1</text><text class="card" x="1050" y="486">N</text>
  <text class="card" x="650" y="420">1</text><text class="card" x="812" y="682">N</text>
  <text class="card" x="1165" y="690">1</text>
  <text class="card" x="1245" y="222">1</text><text class="card" x="1245" y="296">1</text>
  <text class="rel" x="900" y="208">created_by (1-N)</text>

  <!-- ============ BOITES ============ -->

  <!-- platforms -->
  <g transform="translate(40,90)">
    <rect class="bx" width="200" height="86" rx="6"/><rect class="hd" width="200" height="30" rx="6"/><rect class="hd" y="14" width="200" height="16"/>
    <text class="tn" x="12" y="20">platforms</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fld" x="12" y="70">name · manufacturer</text>
  </g>

  <!-- studios -->
  <g transform="translate(40,310)">
    <rect class="bx" width="200" height="100" rx="6"/><rect class="hd" width="200" height="30" rx="6"/><rect class="hd" y="14" width="200" height="16"/>
    <text class="tn" x="12" y="20">studios</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fld" x="12" y="70">name · country</text>
    <text class="fld" x="12" y="88">founded_year</text>
  </g>

  <!-- genres -->
  <g transform="translate(40,560)">
    <rect class="bx" width="200" height="68" rx="6"/><rect class="hd" width="200" height="30" rx="6"/><rect class="hd" y="14" width="200" height="16"/>
    <text class="tn" x="12" y="20">genres</text>
    <text class="pk" x="12" y="50">id  PK · name</text>
  </g>

  <!-- game_platforms -->
  <g transform="translate(320,86)">
    <rect class="bx" width="210" height="92" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">game_platforms</text>
    <text class="pk" x="12" y="50">game_id, platform_id  PK</text>
    <text class="mut" x="12" y="72">les 2 sont des FK · release_region</text>
  </g>

  <!-- game_genres -->
  <g transform="translate(320,566)">
    <rect class="bx" width="210" height="78" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">game_genres</text>
    <text class="pk" x="12" y="50">game_id, genre_id  PK</text>
    <text class="mut" x="12" y="70">les 2 sont des FK</text>
  </g>

  <!-- games (hub) -->
  <g transform="translate(470,250)">
    <rect class="bx" width="220" height="200" rx="6" stroke="#6d28d9" stroke-width="2.5"/><rect class="ha" width="220" height="30" rx="6"/><rect class="ha" y="14" width="220" height="16"/>
    <text class="tn" x="12" y="20">games</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fk" x="12" y="70">studio_id  FK</text>
    <text class="fk" x="12" y="90">created_by  FK (nullable)</text>
    <text class="fld" x="12" y="110">title · description</text>
    <text class="fld" x="12" y="130">release_date · age_rating</text>
    <text class="fld" x="12" y="150">metascore</text>
    <text class="fld" x="12" y="170">elo · cover_url</text>
  </g>

  <!-- duels -->
  <g transform="translate(830,60)">
    <rect class="bx" width="210" height="120" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">duels  (versus)</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fk" x="12" y="70">winner_game_id  FK</text>
    <text class="fk" x="12" y="90">loser_game_id  FK</text>
    <text class="fk" x="12" y="110">user_id  FK</text>
  </g>

  <!-- reviews -->
  <g transform="translate(830,410)">
    <rect class="bx" width="210" height="120" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">reviews</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fk" x="12" y="70">game_id, user_id  FK</text>
    <text class="fld" x="12" y="90">rating (0–20)</text>
    <text class="mut" x="12" y="110">UNIQUE (game_id, user_id)</text>
  </g>

  <!-- library_entries -->
  <g transform="translate(830,630)">
    <rect class="bx" width="210" height="120" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">library_entries</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fk" x="12" y="70">user_id, game_id  FK</text>
    <text class="fld" x="12" y="90">status · playtime_hours</text>
    <text class="mut" x="12" y="110">UNIQUE (user_id, game_id)</text>
  </g>

  <!-- users -->
  <g transform="translate(1180,100)">
    <rect class="bx" width="210" height="120" rx="6"/><rect class="hd" width="210" height="30" rx="6"/><rect class="hd" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">users</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fld" x="12" y="70">username · email</text>
    <text class="fld" x="12" y="90">password_hash</text>
    <text class="fld" x="12" y="110">xp</text>
  </g>

  <!-- user_profiles -->
  <g transform="translate(1180,300)">
    <rect class="bx" width="210" height="100" rx="6"/><rect class="hd" width="210" height="30" rx="6"/><rect class="hd" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">user_profiles</text>
    <text class="pk" x="12" y="50">user_id  PK = FK</text>
    <text class="fld" x="12" y="70">bio</text>
    <text class="fk" x="12" y="90">favorite_platform_id  FK</text>
  </g>

  <!-- topics -->
  <g transform="translate(1180,560)">
    <rect class="bx" width="210" height="100" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">topics  (forum)</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fk" x="12" y="70">user_id  FK · game_id  FK</text>
    <text class="fld" x="12" y="90">title · body</text>
  </g>

  <!-- topic_replies -->
  <g transform="translate(890,760)">
    <rect class="bx" width="210" height="92" rx="6"/><rect class="ha" width="210" height="30" rx="6"/><rect class="ha" y="14" width="210" height="16"/>
    <text class="tn" x="12" y="20">topic_replies</text>
    <text class="pk" x="12" y="50">id  PK</text>
    <text class="fk" x="12" y="72">topic_id  FK · user_id  FK</text>
  </g>

  <!-- ============ LEGENDE ============ -->
  <g transform="translate(40,810)">
    <rect class="bx" width="470" height="92" rx="8"/>
    <text class="fld" x="16" y="26" font-weight="700">Légende</text>
    <rect class="ha" x="16" y="38" width="22" height="14" rx="3"/>
    <text class="fld" x="46" y="50">table de liaison (N-N)</text>
    <rect class="hd" x="16" y="60" width="22" height="14" rx="3"/>
    <text class="fld" x="46" y="72">table d'entité</text>
    <text class="pk" x="290" y="50">PK</text><text class="fld" x="318" y="50">clé primaire</text>
    <text class="fk" x="290" y="72">FK</text><text class="fld" x="318" y="72">clé étrangère</text>
  </g>
</svg>
